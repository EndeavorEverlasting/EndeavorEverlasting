name: Profile banner integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check change scope
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          script=scripts/verify_profile_scope.py
          if git cat-file -e "$BASE_SHA:$script" 2>/dev/null; then
            git show "$BASE_SHA:$script" > "$RUNNER_TEMP/verify_profile_scope.py"
            script="$RUNNER_TEMP/verify_profile_scope.py"
          fi
          python "$script" --range "$BASE_SHA" "$HEAD_SHA"
      - name: Install GIF decoder
        run: python -m pip install 'Pillow>=11,<14'
      - name: Run the full profile verification
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            python scripts/profile_release.py verify --base "$BASE_SHA"
          else
            python scripts/profile_release.py verify
          fi
      - name: Verify the rendered public profile
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python scripts/verify_profile_visuals.py --live
