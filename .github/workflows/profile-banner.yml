name: Profile banner integrity

on:
  push:
    branches: [main]
    paths:
      - "assets/hero.svg"
      - "README.md"
      - "scripts/verify_profile_banner.py"
      - ".github/workflows/profile-banner.yml"
  pull_request:
    paths:
      - "assets/hero.svg"
      - "README.md"
      - "scripts/verify_profile_banner.py"
      - ".github/workflows/profile-banner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify profile banner and responsive layout contract
        run: python scripts/verify_profile_banner.py
