name: Profile banner integrity

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "README.md"
      - "scripts/verify_profile_banner.py"
      - "scripts/verify_profile_visuals.py"
      - "scripts/test_profile_visuals.py"
      - "scripts/render_profile_motion.py"
      - ".github/workflows/profile-banner.yml"
  pull_request:
    paths:
      - "assets/**"
      - "README.md"
      - "scripts/verify_profile_banner.py"
      - "scripts/verify_profile_visuals.py"
      - "scripts/test_profile_visuals.py"
      - "scripts/render_profile_motion.py"
      - ".github/workflows/profile-banner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify profile banner and responsive layout contract
        run: python scripts/verify_profile_banner.py
      - name: Verify profile artwork and motion in this checkout
        run: python scripts/verify_profile_visuals.py
      - name: Test rollout regressions
        run: python -m unittest discover -s scripts -v
      - name: Verify the rendered public profile
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python scripts/verify_profile_visuals.py --live
