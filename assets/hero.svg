    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fd8065"/><stop offset="1" stop-color="#ffbd7c"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" stroke="#718396" stroke-width="0.55" opacity="0.16" fill="none"/></pattern>
    <clipPath id="clip"><rect width="1200" height="390" rx="18"/></clipPath>
  </defs>
