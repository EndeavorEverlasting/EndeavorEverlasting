<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">EndeavorEverlasting — Threading complexity into stability</title>
  <desc id="desc">Editorial dark brand banner featuring geometric flow paths, a coral accent and the statement Threading complexity into stability.</desc>
  <defs>
